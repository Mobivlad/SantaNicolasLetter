[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/link.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/stats.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/link"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/stats"
  [headers.values]
    X-Robots-Tag = "noindex"
