<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Святий Миколай">
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".7" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#f0a800"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#d79a12"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2283f"/>
      <stop offset="1" stop-color="#9e0b22"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </linearGradient>
  </defs>

  <!-- halo -->
  <circle cx="50" cy="42" r="38" fill="url(#halo)"/>
  <circle cx="50" cy="42" r="38" fill="none" stroke="#e09b00" stroke-width="2"/>

  <!-- shoulders: red phelonion + white omophorion with crosses -->
  <path d="M8 100 C10 82 26 73 50 73 C74 73 90 82 92 100 Z" fill="url(#robe)"/>
  <path d="M20 100 L38 76 L50 88 L62 76 L80 100 L69 100 L59 87 L50 97 L41 87 L31 100 Z" fill="#fff"/>
  <path d="M28.5 90 h5 m-2.5 -2.5 v5 M66.5 90 h5 m-2.5 -2.5 v5" stroke="#b01030" stroke-width="2.2" stroke-linecap="round"/>

  <!-- hair -->
  <ellipse cx="34.5" cy="50" rx="6" ry="9" fill="url(#beard)"/>
  <ellipse cx="65.5" cy="50" rx="6" ry="9" fill="url(#beard)"/>

  <!-- face -->
  <ellipse cx="50" cy="49" rx="15" ry="16" fill="#f6cba6"/>
  <circle cx="41" cy="54" r="3.2" fill="#f29b8f" opacity=".55"/>
  <circle cx="59" cy="54" r="3.2" fill="#f29b8f" opacity=".55"/>

  <!-- brows, eyes, nose -->
  <path d="M39.5 44 q4 -3 8 -.5 M52.5 43.5 q4 -2.5 8 .5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M39.5 44 q4 -3 8 -.5 M52.5 43.5 q4 -2.5 8 .5" stroke="#c9d2de" stroke-width=".8" stroke-linecap="round" fill="none"/>
  <path d="M41.5 48.5 q2.5 2 5 0 M53.5 48.5 q2.5 2 5 0" stroke="#3a2a22" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <ellipse cx="50" cy="53.5" rx="2.6" ry="2.2" fill="#e9a988"/>

  <!-- long white beard and moustache -->
  <path d="M35 52 C34 66 39 80 50 86 C61 80 66 66 65 52 C61 60 57 62 50 62 C43 62 39 60 35 52 Z" fill="url(#beard)"/>
  <path d="M42 70 q2 6 3 10 M50 66 v14 M58 70 q-2 6 -3 10" stroke="#cdd6e2" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M50 57.5 C46 55 40 56 38.5 60 C42 61.5 46 61 50 59.5 C54 61 58 61.5 61.5 60 C60 56 54 55 50 57.5 Z" fill="#fff" stroke="#cdd6e2" stroke-width=".7"/>

  <!-- golden mitre (crown) with icon and cross -->
  <path d="M33 37 C32 22 40 13 50 10 C60 13 68 22 67 37 Z" fill="url(#gold)" stroke="#b07a00" stroke-width="1"/>
  <path d="M50 10 V37 M37 20 Q50 28 63 20" stroke="#b07a00" stroke-width="1" fill="none" opacity=".7"/>
  <ellipse cx="50" cy="24" rx="5" ry="6" fill="#1d4fb8" stroke="#fff3b0" stroke-width="1.2"/>
  <circle cx="50" cy="24" r="2" fill="#fff3b0"/>
  <rect x="32" y="34" width="36" height="6.5" rx="3" fill="#c81f39" stroke="#b07a00" stroke-width="1"/>
  <circle cx="38" cy="37.2" r="1.6" fill="#fff3b0"/>
  <circle cx="44" cy="37.2" r="1.6" fill="#3fb37a"/>
  <circle cx="50" cy="37.2" r="1.6" fill="#fff3b0"/>
  <circle cx="56" cy="37.2" r="1.6" fill="#3fb37a"/>
  <circle cx="62" cy="37.2" r="1.6" fill="#fff3b0"/>
  <path d="M50 1.5 V10.5 M46 5 H54" stroke="#d79a12" stroke-width="2.6" stroke-linecap="round"/>
</svg>
