<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a3a">
  <meta name="robots" content="noindex, nofollow">
  <title>Статистика</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .st { display: flex; flex-direction: column; justify-content: center; }
    .st .paper-wrap { width: 100%; }
    .st .greeting { margin-right: 0; }
    .st .paper { font: 400 1rem/1.45 "Nunito", sans-serif; color: #3b2f4a; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 18px; }
    .card { padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, .6); border: 2px dashed var(--line); }
    .card b { display: block; font-size: 1.7rem; line-height: 1.1; color: var(--red); }
    .card span { font-size: .85rem; color: #5b4a6e; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #5b4a6e; font-size: .78rem; }
    .err { color: var(--red); font-weight: 800; min-height: 1.2em; }
    .muted { font-size: .82rem; color: #8a7a66; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="screen st">
    <div class="paper-wrap">
      <div class="paper">
        <h2 class="greeting">Статистика 📊</h2>

        <form id="login" hidden>
          <div class="field">
            <label for="key">Ключ</label>
            <input id="key" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
          </div>
          <p class="err" id="err"></p>
          <button class="btn btn-red" style="width:100%">Показати</button>
        </form>

        <div id="out" hidden>
          <div class="cards">
            <div class="card"><b id="tHeard">0</b><span>листів дітей надіслано</span></div>
            <div class="card"><b id="tLinks">0</b><span>посилань створено</span></div>
            <div class="card"><b id="tEmails">0</b>            <span>листів з посиланнями відкрито</span></div>
            <div class="card"><b id="tMails">0</b><span>листів з посиланнями надіслано</span></div>
          </div>
          <table>
            <thead><tr><th>День</th><th>Посил.</th><th>Відкр.</th><th>Листи</th><th>Без посил.</th></tr></thead>
            <tbody id="days"></tbody>
          </table>
          <p class="muted">Усі числа рахуються від 19.11.2026. «Без посил.» — листи, написані без іменного посилання (приходять на резервну пошту).</p>
          <button type="button" class="btn btn-gold" id="logout" style="width:100%;margin-top:10px">Вийти</button>
        </div>
      </div>
    </div>
  </main>

  <script src="sky.js"></script>
  <script>
    const KEY = "mykolai-stats-key";
    const $ = (id) => document.getElementById(id);
    const num = (v) => Number(v) || 0;

    async function load(key) {
      const r = await fetch("/api/stats", { method: "POST", headers: { "X-Stats-Key": key } });
      if (r.status === 403) throw Object.assign(new Error("Неправильний ключ"), { badKey: true });
      if (!r.ok) throw new Error("Помилка " + r.status);
      const s = await r.json();
      const t = s.total || {};
      $("tHeard").textContent = num(t.letters) + num(t.freeLetters);
      $("tLinks").textContent = num(t.links);
      $("tEmails").textContent = num(s.total.confirmed);
      $("tMails").textContent = num(t.confirmMails);
      $("days").replaceChildren(...s.daily.map((d) => {
        const tr = document.createElement("tr");
        for (const v of [d.d.slice(5).split("-").reverse().join("."), num(d.links), num(d.confirmed), num(d.letters), num(d.freeLetters)]) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.append(td);
        }
        return tr;
      }));
      $("login").hidden = true;
      $("out").hidden = false;
    }

    function showLogin(msg) {
      $("out").hidden = true;
      $("login").hidden = false;
      $("err").textContent = msg || "";
    }

    $("login").addEventListener("submit", (e) => {
      e.preventDefault();
      const key = $("key").value.trim();
      if (!key) return;
      load(key).then(() => localStorage.setItem(KEY, key)).catch((err) => showLogin(err.message));
    });
    $("logout").addEventListener("click", () => { localStorage.removeItem(KEY); $("key").value = ""; showLogin(); });

    const saved = localStorage.getItem(KEY);
    if (saved) load(saved).catch((err) => { if (err.badKey) localStorage.removeItem(KEY); showLogin(err.message); });
    else showLogin();
  </script>
</body>
</html>
